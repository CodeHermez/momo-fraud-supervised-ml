[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "momo-fraud-supervised-ml"
version = "0.1.0"
description = "Risk-based cost-sensitive fraud detection on PaySim mobile money transactions"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "prototype/tests"]
pythonpath = ["src", "prototype"]
filterwarnings = ["ignore::DeprecationWarning"]
